<!doctype html><html lang="de"><meta charset="utf-8"><title>Datenschutz - rclone-hermes</title>
<h1>Datenschutz</h1>
<p>rclone-hermes wird nur vom Betreiber selbst genutzt. Die App greift ausschließlich auf Dateien zu, die sie selbst im Google Drive des Betreibers angelegt hat. Es werden keine Daten an Dritte weitergegeben, verkauft oder ausgewertet.</p></html>
